{% extends 'base.html' %}
{% block content %}

<h3>Upload Prescriptions</h3>

<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}

  {% for order in orders %}
    <div class="card p-3 mb-3">
      <h5>{{ order.medicine.name }}</h5>
      <input type="file" name="prescription_{{ order.id }}" required>
    </div>
  {% endfor %}

  <button class="btn btn-primary w-100">Upload & Continue</button>
</form>

{% endblock %}
