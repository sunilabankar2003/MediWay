<!doctype html>
<html>
  <head>
    <title>Add Medicine</title>
    <style>
      body {
        margin: 0; /* IMPORTANT */
        font-family: Arial;
        background-color: #f4f6f8;

        display: flex;
        justify-content: center; /* horizontal center */
        align-items: center; /* vertical center */
        height: 100vh; /* full screen height */
      }

      .container {
        width: 400px;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      input,
      select {
        width: 90%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .error {
        color: red;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Add Medicine 💊</h2>

      <form method="POST">
        {% csrf_token %}

        <!-- Name -->
        <label>Name</label>
        {{ form.name }}
        <div class="error">{{ form.name.errors }}</div>

        <!-- Price -->
        <label>Price</label>
        {{ form.price }}
        <div class="error">{{ form.price.errors }}</div>

        <!-- Company -->
        <label>Company</label>
        {{ form.company }}
        <div class="error">{{ form.company.errors }}</div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
