<!-- base.html -->

{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MediWay</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <style>
      body {
        overflow-x: hidden;
      }

      .navbar-brand img {
        max-height: 55px;
        width: auto;
      }

      .nav-btn {
        white-space: nowrap;
        padding: 8px 14px;
        font-size: 15px;
        border-radius: 8px;
      }

      .navbar .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      @media (max-width: 991px) {
        .navbar .btn {
          width: 100%;
        }

        .navbar .dropdown {
          width: 100%;
        }

        .navbar .dropdown button {
          width: 100%;
          justify-content: center;
        }
      }

      @media print {
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
      <div class="container">
        <!-- Logo -->

        <a class="navbar-brand d-flex align-items-center" href="/">
          <img src="{% static 'img/logo_.png' %}" alt="MediWay" class="me-2" />
        </a>

        <!-- Mobile Toggle -->

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->

        <div class="collapse navbar-collapse" id="navbarContent">
          {% if user.is_authenticated %}

          <!-- Left Menu -->

          <div
            class="d-flex flex-column flex-lg-row ms-lg-auto gap-2 mt-3 mt-lg-0"
          >
            <a class="btn btn-light nav-btn" href="/">
              Home
              <i class="fa fa-home"></i>
            </a>

            <a class="btn btn-light nav-btn" href="/cart/">
              Cart
              <i class="fa fa-shopping-cart"></i>
            </a>

            <a class="btn btn-light nav-btn" href="/orders/">
              Orders
              <i class="fa-solid fa-cart-arrow-down"></i>
            </a>

            {% if user.is_superuser %}

            <a class="btn btn-info nav-btn" href="/dashboard/">
              Manage Medicines
              <i class="fa-solid fa-tachograph-digital"></i>
            </a>

            <a class="btn btn-info nav-btn" href="/admin-orders/">
              Admin Orders
              <i class="fa-solid fa-cart-arrow-down"></i>
            </a>

            <a class="btn btn-info nav-btn" href="/billing/">
              Billing
              <i class="fa-solid fa-file-invoice"></i>
            </a>

            {% endif %}

            <!-- User Dropdown -->

            <div class="dropdown">
              <button
                class="btn btn-secondary dropdown-toggle d-flex align-items-center"
                type="button"
                data-bs-toggle="dropdown"
              >
                <span
                  class="badge bg-primary rounded-circle me-2"
                  style="
                    width: 32px;
                    height: 32px;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                  "
                >
                  {{ user.username|slice:":1"|upper }}
                </span>

                {{ user.username }}
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="/profile/"> My Profile </a>
                </li>

                <li>
                  <hr class="dropdown-divider" />
                </li>

                <li>
                  <a class="dropdown-item text-danger" href="/logout/">
                    Logout
                    <i class="fa fa-sign-out"></i>
                  </a>
                </li>
              </ul>
            </div>
          </div>

          {% else %}

          <!-- Guest Buttons -->

          <div
            class="d-flex flex-column flex-lg-row ms-lg-auto gap-2 mt-3 mt-lg-0"
          >
            <a class="btn btn-success nav-btn" href="/login/"> Login </a>

            <a class="btn btn-primary nav-btn" href="/signup/"> Signup </a>
          </div>

          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Main Content -->

    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
